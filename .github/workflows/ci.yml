name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Unit tests only: no NDK/native build needed (zxing-cpp is fetched lazily
      # by the native build, which testDebugUnitTest does not invoke).
      - run: ./gradlew :barcode-scanner-sdk:testDebugUnitTest --stacktrace
