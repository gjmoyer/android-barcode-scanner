org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# SDK ships without Hilt so host apps are not forced onto a DI framework.
# zxing-cpp is consumed as a prebuilt Maven Central AAR
# (io.github.zxing-cpp:android, see gradle/libs.versions.toml) — no NDK/CMake
# source build required.

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
